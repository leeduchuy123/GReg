# D5: SD-1.5 + ControlNet + reference attention with one pose-condition variant (docs/diffusion_6_huong_ke_hoach.md Sec. 7)
seed: 0
device: auto
output_dir: outputs/d5/ng

data:
  cache: data/hamnosys_cache
  smplx_dir: models_smplx_v1_1/models
  train_split: train_fit
  pairs_per_clip: 8
  source_first_prob: 0.5          # half the sources at the rest pose, as in the test protocol

model:
  variant: ng                     # k (2D keypoint skeleton) | n (normal map) | ng (normal + mesh warp + V*C + CCM)
  base: stable-diffusion-v1-5/stable-diffusion-v1-5
  work_size: 512
  lora_rank: 16
  sample_steps: 25
  gradient_checkpointing: true

loss:
  w_region: 9.0                   # hands + face latent cells x10 (SignRefine Eq. 4)

train:
  steps: 12000
  batch_size: 2
  grad_accum: 2
  lr_controlnet: 1.0e-5
  lr_lora: 1.0e-4
  warmup: 500
  num_workers: 8
  log_every: 50
  preview_every: 2000
  save_every: 1000
